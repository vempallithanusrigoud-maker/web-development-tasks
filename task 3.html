<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temperature Converter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="converter">

            <h1>Temperature Converter</h1>

            <p class="subtitle">
                Convert temperatures between Celsius, Fahrenheit and Kelvin
            </p>


            <!-- Input -->
            <div class="form-group">

                <label for="temperature">
                    Enter Temperature
                </label>

                <input
                    type="text"
                    id="temperature"
                    placeholder="Enter value"
                >

            </div>


            <!-- Unit Selector -->
            <div class="form-group">

                <label for="unit">
                    Select Input Unit
                </label>

                <select id="unit">

                    <option value="celsius">
                        Celsius (°C)
                    </option>

                    <option value="fahrenheit">
                        Fahrenheit (°F)
                    </option>

                    <option value="kelvin">
                        Kelvin (K)
                    </option>

                </select>

            </div>


            <!-- Convert Button -->

            <button id="convertBtn">
                Convert
            </button>


            <!-- Error Message -->

            <p id="error"></p>


            <!-- Results -->

            <div class="results">

                <h2>Converted Results</h2>

                <div class="result-card">
                    <span>Celsius</span>
                    <strong id="celsiusResult">-- °C</strong>
                </div>

                <div class="result-card">
                    <span>Fahrenheit</span>
                    <strong id="fahrenheitResult">-- °F</strong>
                </div>

                <div class="result-card">
                    <span>Kelvin</span>
                    <strong id="kelvinResult">-- K</strong>
                </div>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
